name: Render Lake Peigneur Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/audio/narration.txt'
      - 'public/audio/narration-cues.json'
      - 'package.json'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm install

      - name: Install narration and audio dependencies
        run: python -m pip install --upgrade pip edge-tts numpy

      - name: Generate narration
        run: python scripts/generate_voice.py --text public/audio/narration.txt --out public/audio/narration.mp3 --voice en-US-GuyNeural --rate +15%

      - name: Generate original score and sound bed
        run: python scripts/make_bed.py --seconds 60 --out public/audio/bed.wav

      - name: Mix and fit soundtrack
        run: python scripts/mix_audio.py --voice public/audio/narration.mp3 --bed public/audio/bed.wav --out public/audio/mix.m4a --seconds 60

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npx remotion render src/index.ts LakePeigneurShort out/lake-peigneur.mp4 --codec h264 --crf 18 --scale 1 --audio-codec aac --concurrency 2

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-short-mp4
          path: out/lake-peigneur.mp4
          if-no-files-found: error
          retention-days: 14
          
